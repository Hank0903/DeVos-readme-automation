name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *" # 每30分鐘自動執行一次
  workflow_dispatch: # 允許我們稍後手動點擊執行測試

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub Activity
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: "Hank0903"
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
